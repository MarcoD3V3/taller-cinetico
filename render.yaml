# Publicar en Render gratis (New → Blueprint → este repositorio).
# El servidor del juego va en Render; la base de datos, en Neon (PostgreSQL gratuito que no
# caduca). Al crear el Blueprint, Render pide las dos variables secretas: la dirección de Neon
# y el Client Secret de Discord. Ver DESPLEGAR.md.
services:
  - type: web
    name: taller-cinetico
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install
    startCommand: node servidor.js
    healthCheckPath: /api/info
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DISCORD_CLIENT_ID
        value: "1562327426837516288"
      # Se escriben en el panel de Render (nunca en el código)
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
